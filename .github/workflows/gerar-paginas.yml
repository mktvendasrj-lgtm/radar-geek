name: Gerar páginas de produto

on:
  push:
    paths:
      - "produtos.json"
      - "gerar-paginas.js"
  workflow_dispatch: # permite rodar manualmente pela aba Actions do GitHub

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rodar script gerador
        run: node gerar-paginas.js

      - name: Commitar páginas geradas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add produtos/ sitemap.xml
          git diff --staged --quiet || git commit -m "Atualiza páginas de produto automaticamente"
          git push
